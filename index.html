<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>KUSH QUEST</title>
<style>html,body{margin:0;height:100%;background:#0b1a0c;overflow:hidden;touch-action:none;user-select:none}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#c{image-rendering:pixelated;image-rendering:crisp-edges;background:#9bbc0f;max-height:100%}#ui{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}#pad{width:120px;height:120px;border-radius:50%;border:3px solid #306230;background:rgba(15,56,15,.45);pointer-events:auto;position:relative}#knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#8bac0f;left:36px;top:36px}#acts{display:flex;gap:10px;pointer-events:auto}.ab{width:64px;height:64px;border-radius:50%;border:3px solid #0f380f;background:#8bac0f;color:#0f380f;font:800 18px ui-monospace,monospace}</style></head>
<body><div id="wrap"><canvas id="c" width="160" height="144"></canvas></div>
<div id="ui"><div id="pad"><div id="knob"></div></div><div id="acts"><button class="ab" id="bB" type="button">B</button><button class="ab" id="bA" type="button">A</button></div></div>
<script>
(() => {
const CV=document.getElementById("c"), X=CV.getContext("2d"); X.imageSmoothingEnabled=false;
const W=160,H=144,T=16;
const PAL={black:"#0f380f",dark:"#306230",mid:"#8bac0f",lite:"#9bbc0f",white:"#e0f8d0",skin:"#e8c89a",path:"#c4a85a",pathd:"#9a7c3a",wall:"#7a5a3a",roof:"#6b3030",hp:"#d05050",box:"#e8f8d8",ink:"#0f380f",leaf:"#1f6b28",gold:"#d8c030"};
function fit(){const vv=window.visualViewport;const vw=Math.max(300,(vv&&vv.width)||innerWidth);const vh=Math.max(400,(vv&&vv.height)||innerHeight)-8;const s=Math.floor(Math.min(vw/W,(vh-90)/H));CV.style.width=(W*Math.max(2,s))+"px";CV.style.height=(H*Math.max(2,s))+"px";}
fit(); addEventListener("resize",fit); if(window.visualViewport) visualViewport.addEventListener("resize",fit);
const STRAINS=[{id:"og",n:"OG Kush",t:"Hybrid",pow:78},{id:"sd",n:"Sour Diesel",t:"Sativa",pow:74},{id:"nl",n:"N. Lights",t:"Indica",pow:80},{id:"bd",n:"Blue Dream",t:"Hybrid",pow:76},{id:"gsc",n:"GSC",t:"Hybrid",pow:83},{id:"gg",n:"GG4",t:"Hybrid",pow:85},{id:"gel",n:"Gelato",t:"Hybrid",pow:84},{id:"zz",n:"Zaza",t:"Hybrid",pow:88},{id:"dp",n:"Durban",t:"Sativa",pow:73},{id:"gdp",n:"GDP",t:"Indica",pow:79},{id:"jh",n:"Jack Herer",t:"Sativa",pow:75},{id:"ww",n:"White Widow",t:"Hybrid",pow:72}];
const HITS=[{id:"joint",n:"Joint tap",mul:0.7,cost:0.4},{id:"bowl",n:"Bowl hit",mul:1.0,cost:0.7},{id:"bong",n:"Bong hit",mul:1.35,cost:1.0},{id:"blunt",n:"Blunt hit",mul:1.7,cost:1.4}];
const SIZES=[{n:"a gram",g:1},{n:"an eighth",g:3.5},{n:"a quarter",g:7},{n:"a half O",g:14},{n:"an O",g:28},{n:"a QP",g:112},{n:"a half pound",g:224},{n:"a pound",g:448}];
const COLS=24,ROWS=16,GRASS=0,PATH=1,TREE=2,BLD=3;
const map=[];
for(let y=0;y<ROWS;y++){map[y]=[];for(let x=0;x<COLS;x++){let t=GRASS;if(x>=8&&x<=15)t=PATH;if(y===8||y===9)t=PATH;if(x<=1||x>=COLS-2||y===0||y===ROWS-1)t=TREE;if((x<8||x>15)&&((x*3+y*5)%5===0)&&y>1&&y<ROWS-2)t=TREE;if(x>=10&&x<=13&&y>=5&&y<=7)t=BLD;map[y][x]=t;}}
function solid(tx,ty){if(ty<0||tx<0||ty>=ROWS||tx>=COLS)return true;const t=map[ty][tx];return t===TREE||t===BLD;}
const S={px:12.5,py:10.5,dir:0,walk:0,cash:180,bag:[{...STRAINS[0],g:112,fresh:100}],fade:0,mode:"world",text:[],deal:null,match:null,menu:0,bagLvl:1};
function grams(){return S.bag.reduce((a,b)=>a+b.g,0);}
function best(){return S.bag.filter(s=>s.g>=0.4&&s.fresh>5).sort((a,b)=>b.pow*b.fresh-a.pow*a.fresh)[0];}
function addStrain(st,g){const h=S.bag.find(x=>x.id===st.id);if(h){h.g=+(h.g+g).toFixed(2);h.fresh=Math.max(h.fresh,90);}else S.bag.push({...st,g:+g.toFixed(2),fresh:100});}
const plants=[];
for(let i=0;i<8;i++){const west=i<4;const x=west?2+Math.random()*5:17+Math.random()*4;const y=2+Math.random()*12;const tx=x|0,ty=y|0;if(map[ty]&&map[ty][tx]===GRASS)plants.push({x:x+.5,y:y+.5,s:STRAINS[1+(i%11)],gone:false});}
const npcs=[{x:9.5,y:10.5,kind:"buy",name:"MARV",shirt:"#3068a0"},{x:14.5,y:9.5,kind:"match",name:"DEE",shirt:"#a03050"},{x:11.5,y:9.5,kind:"shop",name:"SHOP",shirt:"#d8c030"}];
function say(lines,after){S.mode="text";S.text=typeof lines==="string"?[lines]:lines.slice();S.after=after||null;}
function nextText(){S.text.shift();if(!S.text.length){const fn=S.after;S.after=null;S.mode="world";if(fn)fn();}}
function startDeal(npc){const want=SIZES[Math.random()<0.45?(Math.random()*5|0):(Math.random()*SIZES.length|0)];const strain=S.bag.filter(s=>s.g>=1).sort((a,b)=>b.g-a.g)[0];if(!strain){say(["MARV: You ain't holding."]);return;}const fair=Math.round(strain.pow*0.55*want.g);S.deal={npc,want,strain,fair,offer:fair,step:"ask"};say([npc.name+": You holding? I need "+want.n+"."],()=>{S.mode="deal";});}
function quote(price){const d=S.deal;if(!d)return;if(d.strain.g+0.01<d.want.g){say([d.npc.name+": That's "+d.want.n+". You only got "+d.strain.g.toFixed(1)+"g.","Come back when you can fill it."],()=>{S.deal=null;});return;}const max=Math.round(d.fair*1.18);if(price<=d.fair){d.strain.g=+(d.strain.g-d.want.g).toFixed(2);if(d.strain.g<0.3)S.bag=S.bag.filter(s=>s!==d.strain);S.cash+=price;say([d.npc.name+": Bet. Here's $"+price+"."],()=>{S.deal=null;});}else if(price<=max){const counter=Math.round((d.fair+price)/2);d.offer=counter;d.step="counter";say([d.npc.name+": That's high. I'll do $"+counter+"."],()=>{S.mode="deal";});}else say([d.npc.name+": Nah. Too rich."],()=>{S.deal=null;});}
function startMatch(npc){const mine=best();if(!mine){say([npc.name+": You got nothing to match."]);return;}const foe=STRAINS[3+((Math.random()*8)|0)];say([npc.name+": Wanna match?","Winner's the stronger pack."],()=>{S.match={npc,mine,foe:{...foe,fresh:92},hp:100,ehp:100,turn:"you",log:npc.name+" pulls out "+foe.n+"."};S.mode="match";S.menu=0;});}
function hitDmg(st,hit){const fresh=Math.max(0.3,st.fresh/100);return Math.max(6,Math.round((st.pow/100)*hit.mul*32*fresh));}
function doHit(){const M=S.match;if(!M||M.turn!=="you")return;const hit=HITS[S.menu]||HITS[0];if(M.mine.g<hit.cost){M.log="Not enough "+M.mine.n+".";return;}M.mine.g=+(M.mine.g-hit.cost).toFixed(2);M.mine.fresh=Math.max(8,M.mine.fresh-3);const d=hitDmg(M.mine,hit);M.ehp=Math.max(0,M.ehp-d);M.log="You make 'em take a "+M.mine.n+" "+hit.n.toLowerCase()+"! -"+d;if(M.ehp<=0){winMatch();return;}M.turn="them";setTimeout(()=>{if(S.match&&S.match.turn==="them")enemyHit();},500);}
function enemyHit(){const M=S.match;if(!M)return;const hit=HITS[1+(Math.random()*3)|0];const d=hitDmg(M.foe,hit);M.hp=Math.max(0,M.hp-d);M.log=M.npc.name+" hits you with a "+M.foe.n+" "+hit.n.toLowerCase()+"! -"+d;if(M.hp<=0){loseMatch();return;}M.turn="you";}
function winMatch(){const prize=40+(S.match.foe.pow|0);S.cash+=prize;say(["They tap out.","You took $"+prize+" off the match."],()=>{S.match=null;S.mode="world";});}
function loseMatch(){S.cash=0;S.bag.forEach(s=>s.g=+(s.g*0.5).toFixed(2));S.bag=S.bag.filter(s=>s.g>=0.3);S.fade=1;S.px=12.5;S.py=10.5;say(["The pack was too heavy.","You black out...","...wake up in town.","Pockets empty. Stash cut in half."],()=>{S.match=null;S.mode="world";S.fade=0;});}
function shop(){say(["SHOP: Bags and nutrients."],()=>{S.mode="shop";S.menu=0;});}
function interact(){if(S.mode==="text"){nextText();return;}for(const p of plants){if(!p.gone&&Math.hypot(S.px-p.x,S.py-p.y)<0.7){p.gone=true;addStrain(p.s,3.5+Math.random()*4);say(["Found a cut of "+p.s.n+"."]);return;}}for(const n of npcs){if(Math.hypot(S.px-n.x,S.py-n.y)<1.05){if(n.kind==="buy")startDeal(n);else if(n.kind==="match")startMatch(n);else shop();return;}}say(["Nothing here."]);}
const stick={x:0,y:0,id:null};const pad=document.getElementById("pad"),knob=document.getElementById("knob");
function setStick(cx,cy){const r=pad.getBoundingClientRect();let mx=cx-(r.left+r.width/2),my=cy-(r.top+r.height/2);const mag=Math.hypot(mx,my)||1,k=Math.min(1,mag/42);stick.x=(mx/mag)*k;stick.y=(my/mag)*k;knob.style.left=36+stick.x*28+"px";knob.style.top=36+stick.y*28+"px";}
function clearStick(){stick.x=stick.y=0;stick.id=null;knob.style.left="36px";knob.style.top="36px";}
pad.addEventListener("pointerdown",e=>{e.preventDefault();stick.id=e.pointerId;pad.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY);});
pad.addEventListener("pointermove",e=>{if(e.pointerId===stick.id)setStick(e.clientX,e.clientY);});
pad.addEventListener("pointerup",clearStick);pad.addEventListener("pointercancel",clearStick);
const keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key==="Enter"||e.key==="z"||e.key===" "){e.preventDefault();pressA();}if(e.key==="Escape"||e.key==="x")pressB();});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.getElementById("bA").onpointerdown=e=>{e.preventDefault();pressA();};
document.getElementById("bB").onpointerdown=e=>{e.preventDefault();pressB();};
function pressA(){if(S.mode==="text"){nextText();return;}if(S.mode==="match"){doHit();return;}if(S.mode==="deal"){quote(S.deal.offer);return;}if(S.mode==="shop"){if(S.menu===0){if(S.cash>=80){S.cash-=80;S.bagLvl++;say(["Got an airtight bag."]);}else say(["Not enough cash."]);}else if(S.menu===1){if(S.cash>=25){S.cash-=25;const b=best();if(b){b.fresh=100;b.pow=Math.min(99,b.pow+1);}say(["Fed the top cut."]);}else say(["Not enough cash."]);}else S.mode="world";return;}if(S.mode==="bag"){S.mode="world";return;}interact();}
function pressB(){if(S.mode==="text"){nextText();return;}if(S.mode==="match"){say(["You back out."],()=>{S.match=null;});return;}if(S.mode==="deal"){if(S.deal&&S.deal.step==="counter"){say(["MARV: I'm out."],()=>{S.deal=null;});return;}S.deal.offer=Math.max(5,Math.round(S.deal.offer*0.85));return;}if(S.mode==="shop"){S.mode="world";return;}if(S.mode==="world")S.mode="bag";else S.mode="world";}
let acc=0;
function update(dt){if(S.fade>0)S.fade=Math.max(0,S.fade-dt);if(S.mode!=="world")return;let ix=stick.x,iy=stick.y;if(keys.arrowleft||keys.a)ix-=1;if(keys.arrowright||keys.d)ix+=1;if(keys.arrowup||keys.w)iy-=1;if(keys.arrowdown||keys.s)iy+=1;const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}if(m>0.15){S.walk+=dt*8;if(Math.abs(ix)>Math.abs(iy))S.dir=ix<0?2:3;else S.dir=iy<0?1:0;const nx=S.px+ix*3.4*dt,ny=S.py+iy*3.4*dt;if(!solid(nx|0,S.py|0))S.px=nx;if(!solid(S.px|0,ny|0))S.py=ny;}else S.walk=0;S.bag.forEach(s=>s.fresh=Math.max(0,s.fresh-dt*(0.08/S.bagLvl)));}
function pset(x,y,w,h,c){X.fillStyle=c;X.fillRect(x|0,y|0,w,h);}
function box(x,y,w,h){pset(x,y,w,h,PAL.ink);pset(x+1,y+1,w-2,h-2,PAL.white);pset(x+2,y+2,w-4,h-4,PAL.box);}
function print(str,x,y,c){X.fillStyle=c||PAL.ink;X.font="6px monospace";X.fillText(str,x,y);}
function tree(sx,sy){pset(sx+6,sy+10,4,6,PAL.wall);pset(sx+2,sy+2,12,10,PAL.leaf);pset(sx+4,sy+1,8,3,PAL.dark);}
function house(sx,sy){pset(sx,sy+6,16,10,PAL.wall);pset(sx+1,sy,14,8,PAL.roof);pset(sx+6,sy+10,4,6,PAL.pathd);}
function dude(sx,sy,shirt,frame){pset(sx+5,sy+1,6,5,PAL.skin);pset(sx+4,sy+6,8,6,shirt);const leg=frame%2?1:0;pset(sx+4+leg,sy+12,3,4,PAL.ink);pset(sx+9-leg,sy+12,3,4,PAL.ink);}
function drawWorld(){const camx=Math.max(0,Math.min(COLS*T-W,S.px*T-W/2));const camy=Math.max(0,Math.min(ROWS*T-H,S.py*T-H/2));for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const sx=x*T-camx,sy=y*T-camy,t=map[y][x];if(t===GRASS){pset(sx,sy,T,T,(x+y)%2?PAL.mid:PAL.lite);pset(sx+3,sy+5,1,1,PAL.dark);}else if(t===PATH){pset(sx,sy,T,T,PAL.path);pset(sx+7,sy,2,T,PAL.pathd);}else if(t===BLD)house(sx,sy);else tree(sx,sy);}print("WEST",2*T-camx,18-camy,PAL.ink);print("TOWN",11*T-camx,4*T-camy,PAL.ink);print("EAST",19*T-camx,18-camy,PAL.ink);for(const p of plants){if(p.gone)continue;const sx=p.x*T-camx-3,sy=p.y*T-camy-3;pset(sx+2,sy+4,2,5,PAL.wall);pset(sx,sy,6,5,PAL.leaf);pset(sx+2,sy-1,2,2,PAL.gold);}for(const n of npcs)dude(n.x*T-camx-8,n.y*T-camy-16,n.shirt,0);dude(S.px*T-camx-8,S.py*T-camy-16,"#e8d020",S.walk|0);box(0,0,160,12);print("$"+S.cash+"  BAG "+grams().toFixed(0)+"g",4,9);}
function drawText(){box(2,98,156,44);const line=S.text[0]||"";print(line.slice(0,24),8,114);if(line.length>24)print(line.slice(24,48),8,124);print("A >",132,136,PAL.dark);}
function drawDeal(){const d=S.deal;if(!d)return;box(2,56,156,86);print(d.npc.name+" wants "+d.want.n,8,70);print(d.strain.n+"  "+d.strain.g.toFixed(1)+"g",8,82);print("YOUR PRICE $"+d.offer,8,98);print("A sell   stick = price",8,114);print("B lower / walk",8,126);}
function drawMatch(){const M=S.match;if(!M)return;pset(0,0,W,H,PAL.lite);pset(0,0,W,54,PAL.dark);print(M.npc.name,8,12,PAL.white);print(M.foe.n,8,22,PAL.white);pset(8,28,80,6,PAL.ink);pset(8,28,Math.max(0,M.ehp*0.8),6,PAL.hp);print("YOU",8,72);print(M.mine.n+" "+M.mine.g.toFixed(1)+"g",8,82);pset(8,88,80,6,PAL.ink);pset(8,88,Math.max(0,M.hp*0.8),6,"#30a030");box(2,100,156,42);print((M.log||"").slice(0,26),8,114);if(M.turn==="you"){print("> "+M.mine.n+" "+HITS[S.menu].n,8,128);print("stick change  A use",8,138,PAL.dark);}}
function drawBag(){box(8,16,144,112);print("BAG  $"+S.cash,14,30);S.bag.slice(0,6).forEach((s,i)=>print(s.n.slice(0,12)+" "+s.g.toFixed(1)+"g f"+Math.round(s.fresh),14,46+i*12));print("B close",14,120,PAL.dark);}
function drawShop(){box(8,40,144,80);print(S.menu===0?"> Airtight $80":"  Airtight $80",16,60);print(S.menu===1?"> Nutrients $25":"  Nutrients $25",16,76);print(S.menu===2?"> Leave":"  Leave",16,92);}
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;acc+=dt;
if(S.mode==="match"&&(keys.arrowdown||stick.y>0.45)&&acc>0.18){S.menu=(S.menu+1)%HITS.length;acc=0;}
if(S.mode==="match"&&(keys.arrowup||stick.y<-0.45)&&acc>0.18){S.menu=(S.menu+3)%HITS.length;acc=0;}
if(S.mode==="shop"&&(keys.arrowdown||stick.y>0.45)&&acc>0.18){S.menu=(S.menu+1)%3;acc=0;}
if(S.mode==="deal"&&S.deal){if((keys.arrowup||stick.y<-0.45)&&acc>0.12){S.deal.offer+=5;acc=0;}if((keys.arrowdown||stick.y>0.45)&&acc>0.12){S.deal.offer=Math.max(1,S.deal.offer-5);acc=0;}}
update(dt);X.fillStyle=PAL.lite;X.fillRect(0,0,W,H);
if(S.mode==="match")drawMatch();else{drawWorld();if(S.mode==="text")drawText();else if(S.mode==="deal")drawDeal();else if(S.mode==="bag")drawBag();else if(S.mode==="shop")drawShop();}
if(S.fade>0){X.fillStyle="rgba(0,0,0,"+S.fade+")";X.fillRect(0,0,W,H);}requestAnimationFrame(loop);}
say(["You roll in with a QP of OG.","Woods west and east.","A talk   B bag"]);
requestAnimationFrame(loop);
})();
</script></body></html>
